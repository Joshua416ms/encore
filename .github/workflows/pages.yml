# Publishes ONLY the app/ folder to GitHub Pages whenever app files change on the main branch.
# docs/ and everything else stay out of the public website (they are still visible in the repo).
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab
  # A failed run can't be fixed with "Re-run": the re-run adds a second "github-pages" package and Deploy refuses
  # both. Start a new run with "Run workflow" instead.

# Least privilege for the automation token: read the code, write to Pages, prove identity to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false   # don't leave a Git token lying around in the build machine

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the app folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: app

      # Deploy sometimes asks for the package before GitHub lists it ("No artifacts named github-pages were found";
      # hit 3 of 6 runs in Nov 2026). So: try once, and if that fails, wait and try again. Only the retry can fail
      # the run.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
