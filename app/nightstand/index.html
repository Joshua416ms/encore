<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com https://accounts.spotify.com https://api.spotify.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Nightstand</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nightstand">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Manrope:wght@400;600;700&display=swap">
<link rel="stylesheet" href="nightstand.css">
</head>
<body>

<main class="pager" id="pager" aria-label="Nightstand views">
  <section class="page" id="p-clock" aria-label="Clock">
    <div class="big shift" id="bigWrap">
      <div class="date" id="bigDate">Wednesday, November 18</div>
      <div class="time" aria-live="off"><span class="h" id="bigH">10</span><span class="colon" id="colon">:</span><span class="m" id="bigM">42</span><span class="ampm" id="bigAP">PM</span></div>
    </div>
  </section>

  <section class="page" id="p-wx" aria-label="Weather">
    <div class="wx shift" id="wxWrap">
      <div class="wx-now">
        <div class="wx-place"><span id="wxPlace">Example city</span><span class="pill" id="wxPill">Example</span><button class="btn ghost small" id="wxSet" type="button">Set location</button></div>
        <div class="wx-temp"><span class="deg" id="wxTemp">54°</span><span id="wxIcon"></span></div>
        <div class="wx-cond" id="wxCond">Partly cloudy</div>
        <div class="wx-meta" id="wxMeta"></div>
      </div>
      <div class="wx-side">
        <div class="wx-hours" id="wxHours"></div>
        <div class="wx-days" id="wxDays"></div>
        <div class="wx-foot" id="wxFoot"></div>
      </div>
    </div>
  </section>

  <section class="page" id="p-cal" aria-label="Analog clock and calendar">
    <div class="split shift" id="calWrap">
      <svg class="analog" id="analog" viewBox="0 0 200 200" role="img" aria-label="Analog clock">
        <circle class="face" cx="100" cy="100" r="98"></circle>
        <g id="ticks"></g>
        <line class="hh" id="hh" x1="100" y1="100" x2="100" y2="54" stroke-width="7"></line>
        <line class="mh" id="mh" x1="100" y1="100" x2="100" y2="26" stroke-width="4.5"></line>
        <line class="sh" id="sh" x1="100" y1="116" x2="100" y2="18" stroke-width="1.8"></line>
        <circle class="hub" cx="100" cy="100" r="5"></circle>
        <circle class="hubin" cx="100" cy="100" r="1.8"></circle>
      </svg>
      <div class="cal">
        <div class="cal-head"><span id="calMonth">November</span><span class="yr" id="calYear">2026</span></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-foot" id="calFoot"></div>
      </div>
    </div>
  </section>
</main>

<div class="dots" id="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>

<div class="controls" id="controls">
  <button class="iconbtn" id="fsBtn" aria-label="Full screen" hidden>
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button class="iconbtn" id="gearBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</div>

<aside class="sheet" id="sheet" aria-label="Settings">
  <header class="sheet-head"><h2>Settings</h2><button class="iconbtn" id="closeBtn" aria-label="Close settings"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>

  <h3 class="group-title">Clock</h3>
  <div class="card">
    <div class="row"><label class="row-label" for="set24">24-hour time</label><input class="switch" type="checkbox" id="set24"></div>
  </div>

  <h3 class="group-title">Accent color</h3>
  <div class="card"><div class="swatches" id="swatches"></div></div>

  <h3 class="group-title">Weather</h3>
  <div class="card">
    <div class="row"><span class="row-label">Location</span><span class="value" id="locLabel">Not set</span></div>
    <form class="row locform" id="locForm"><input id="locInput" type="search" placeholder="Search for a city" autocomplete="off" aria-label="City name"><button class="seg-btn" type="submit">Search</button></form>
    <div class="locresults" id="locResults"></div>
    <div class="row"><button class="row-btn" type="button" id="locHere">Use my location</button></div>
    <div class="row"><span class="row-label" id="unitsLabel">Temperature</span>
      <div class="seg" id="setUnits" role="radiogroup" aria-labelledby="unitsLabel"><button type="button" role="radio" data-v="F">°F</button><button type="button" role="radio" data-v="C">°C</button></div></div>
  </div>

  <h3 class="group-title">Screen</h3>
  <div class="card">
    <div class="row"><label class="row-label" for="setWake">Keep screen on</label><input class="switch" type="checkbox" id="setWake"></div>
  </div>
</aside>

<!-- Shown when Encore's sleep timer ends while you are here. Tap to come back. -->
<div class="sleep-screen" id="sleepScreen" aria-hidden="true"></div>

<script src="nightstand.js"></script>
</body>
</html>
